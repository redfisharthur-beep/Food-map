<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="選擇台灣縣市、餐飲類型與預算，找到更值得吃的餐廳。">
  <title>食光地圖｜找到值得吃的好店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main class="site">
    <header class="site-head">
      <button class="brand" id="brand" type="button" aria-label="返回縣市首頁">
        <span class="brand-mark"></span><span>食光地圖</span>
      </button>
      
    </header>

    <section id="home-view" class="view">
      <div class="home-art">
        <img id="home-image" src="/assets/map.webp" alt="台灣縣市美食地圖" draggable="false">
        <svg id="home-image-hotspots" class="hotspots" xmlns="http://www.w3.org/2000/svg" aria-label="選擇台灣縣市" role="group"></svg>
      </div>
    </section>

    <section id="results-view" class="view" hidden>
      <div class="results-title">
        <button id="back" type="button" class="text-button">所有縣市</button>
        <h1 id="county-title"></h1>
      </div>
      <div class="filter-panel">
        <div class="filter-row place-price">
          <div class="town-group">
            <label for="town">地區</label>
            <select id="town" aria-label="選擇鄉鎮市區"><option value="全區">全區</option></select>
          </div>
          <div class="price-group">
            <div class="filter-label">價位</div>
            <div id="prices" class="choice-set compact" aria-label="價位篩選">
              <button type="button" data-value="all" class="active">不限</button>
              <button type="button" data-value="low">200 以內</button>
              <button type="button" data-value="mid">200–400</button>
              <button type="button" data-value="high">400 以上</button>
            </div>
          </div>
        </div>
        <div class="filter-stack">
          <div class="filter-label">用餐時段</div>
          <div id="meals" class="choice-set" aria-label="餐飲時段"></div>
        </div>
        <div class="filter-stack">
          <div class="filter-label">料理種類</div>
          <div id="cuisines" class="choice-set" aria-label="料理種類"></div>
        </div>
      </div>
      <div class="section-heading results-heading">
        <h2>推薦餐廳</h2>
        <span id="result-count" aria-live="polite"></span>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="restaurant-list" class="restaurant-list" aria-live="polite"></div>
    </section>
    <footer class="site-foot">食光地圖 · FOOD MAP <span class="footer-links"><a href="/privacy.html">隱私</a><a href="/terms.html">條款</a></span></footer>
  </main>
</body>
</html>
