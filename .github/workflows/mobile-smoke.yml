name: Mobile UI smoke check
on:
  push:
    paths:
      - ".github/workflows/mobile-smoke.yml"
      - "tests/live-mobile.mjs"
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-mobile.mjs
