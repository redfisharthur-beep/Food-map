name: Inspect homepage map
on:
  push:
    paths: [".github/workflows/inspect-map.yml", "public/assets/map-areas.json"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --user Pillow
      - name: Encode low-resolution map preview
        run: |
          python - <<'PY'
          import base64, io
          from PIL import Image
          im=Image.open('public/assets/map.webp')
          print('ORIGINAL_MAP_DIMENSIONS',im.size,flush=True)
          im.thumbnail((850,1550))
          from PIL import ImageDraw
          im=im.convert('RGB')
          draw=ImageDraw.Draw(im)
          import json
          data=json.load(open('public/assets/map-areas.json'))
          colors=[(255,255,255),(0,0,0),(235,10,40),(28,15,160),(22,118,28)]
          for index,(county,parts) in enumerate(data['areas'].items()):
            c=colors[index%len(colors)]
            for part in parts:
              poly=[tuple(p) for p in part]
              draw.line(poly+[poly[0]],fill=c,width=3,joint='curve')
            xx=sum(p[0] for p in parts[0])/len(parts[0])
            yy=sum(p[1] for p in parts[0])/len(parts[0])
            draw.text((xx-5,yy-5),str(index+1),fill=(255,255,255),stroke_width=2,stroke_fill=(0,0,0))
          print('COUNTY_ORDER',list(enumerate(data['areas'],1)),flush=True)
          out=io.BytesIO()
          im.convert('RGB').save(out,format='JPEG',quality=77,optimize=True)
          value=base64.b64encode(out.getvalue()).decode('ascii')
          print('IMAGE_BASE64_START',flush=True)
          for i in range(0,len(value),700):
            print('MAP_PART_'+value[i:i+700],flush=True)
          print('IMAGE_BASE64_END',flush=True)
          PY
