name: Live website smoke check
on:
  push:
    paths:
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Cloudflare deployment and APIs
        env:
          BASE: https://food-map.redfisharthur.workers.dev
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse, sys
          base=os.environ["BASE"]
          urls=[
            ("homepage", base+"/"),
            ("frontend JS", base+"/app.js"),
            ("county list", base+"/data/taiwan-districts.json"),
            ("API health", base+"/api/health"),
            ("live restaurant search", base+"/api/search?"+urllib.parse.urlencode({"county":"彰化縣","town":"溪湖鎮","price":"all","meal":"不限","cuisine":"不限"}))
          ]
          failures=[]
          for label, url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"FoodMapSmoke/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=35) as resp:
                data=resp.read()
                print(f"{label}: HTTP {resp.status}; {len(data)} bytes",flush=True)
                if label=="API health":
                  info=json.loads(data)
                  print("API bindings:",json.dumps(info,ensure_ascii=False),flush=True)
                  if not info.get("google") or not info.get("langsearch"):
                    failures.append("missing API secrets")
                if label=="live restaurant search":
                  info=json.loads(data)

                  restaurants=info.get("restaurants",[])
                  print("Search:",json.dumps({"count":info.get("count"),"names":[x.get("name") for x in restaurants[:4]],"features":[x.get("feature") for x in restaurants[:2]]},ensure_ascii=False),flush=True)
                  for place in restaurants:
                    if not (1<=int(place.get("score",0))<=99):failures.append("invalid score")
                    if len(place.get("feature",""))>50:failures.append("feature too long")
                    if "google." not in place.get("mapsUrl",""):failures.append("missing Google Maps URL")
                  photo=next((p.get("photoRef") for p in restaurants if p.get("photoRef")),None)
                  if photo:
                    photo_url=base+"/api/photo?"+urllib.parse.urlencode({"name":photo})
                    try:
                      with urllib.request.urlopen(photo_url,timeout=30) as img:
                        image_type=img.headers.get("Content-Type","")
                        image_data=img.read()
                        print("Restaurant photo:",img.status,image_type,len(image_data),"bytes",flush=True)
                        if not image_type.startswith("image/") or not image_data:failures.append("photo format incorrect")
                    except Exception as exc:
                      failures.append("restaurant photo: "+str(exc))
                      print("Restaurant photo: FAILED",str(exc),flush=True)
                  else:
                    print("Restaurant photo: no images returned by Places",flush=True)
                if label=="homepage" and (b"food-map" not in data.lower() and "食光地圖".encode() not in data):
                  failures.append("unexpected homepage response")
            except Exception as exc:
              failures.append(label+": "+str(exc))
              print(f"{label}: FAILED: {exc}",flush=True)
          print("FINAL:", "PASS" if not failures else "FAILED "+str(failures),flush=True)
          if failures: sys.exit(1)
          PY
